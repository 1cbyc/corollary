[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "corollary"
dynamic = ["version"]
description = "An agent runtime where the unit of state is a belief, not a message."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Santana" }]
keywords = [
    "agents",
    "llm",
    "truth-maintenance",
    "belief-revision",
    "provenance",
    "verification",
    "knowledge-representation",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The core has no runtime dependencies. Model SDKs are optional extras.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.0"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/gabe-santana/corollary"
Documentation = "https://github.com/gabe-santana/corollary/tree/main/docs"
Repository = "https://github.com/gabe-santana/corollary"
Issues = "https://github.com/gabe-santana/corollary/issues"
Changelog = "https://github.com/gabe-santana/corollary/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/corollary/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/corollary"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--doctest-modules", "--import-mode=importlib"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["corollary"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET"]
ignore = ["RET504", "SIM108", "RUF001", "RUF002", "RUF003", "UP005"]  # UP005 would rewrite BeliefBase.assert_

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]
"examples/**" = ["T201"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["corollary"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "openai", "openai.*"]
ignore_missing_imports = true
